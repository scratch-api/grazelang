[workspace]
resolver = "3"
members = [
    "grazelang",
    "grazelang_types",
    "grazelang_library_parser",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
sha3 = "0.12.0"
arcstr = { version = "1.2.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quote = "1.0.45"
base16ct = { version = "1.0.0", features = ["alloc"] }
toml = "1.1.4"
